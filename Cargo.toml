[package]
name = "devy"
version = "0.1.0"
edition = "2024"
description = "Devy: Realtime Notifications"
license = "MIT"

[[bin]]
name = "devy"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
dotenvy = "0.15"
hex = "0.4"
hmac = "0.13"
octocrab = { version = "0.54", default-features = false, features = ["jwt-rust-crypto"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
subtle = "2"
teloxide = { version = "0.17", default-features = false, features = ["macros", "rustls"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
